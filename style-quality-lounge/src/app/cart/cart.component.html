<div class="cart-container">
  <h2>Koszyk</h2>

  <div *ngIf="loading">Ładowanie koszyka...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="!loading && !error && cartItems.length === 0" class="empty-cart-message">
    Twój koszyk jest pusty.
  </div>

  <ng-container *ngIf="!loading && !error && cartItems.length > 0">
    <app-cart-item
      *ngFor="let item of cartItems"
      [cartItem]="item"
      (quantityChange)="updateQuantity(item, $event)"
      (remove)="removeItem(item)"
    ></app-cart-item>

    <div class="summary">
      <p>Subtotal <span>{{ calculateSummary().subtotal | currency:'PLN ':'symbol':'1.2-2' }}</span></p>
      <p>Shipping <span>{{ calculateSummary().shipping | currency:'PLN ':'symbol':'1.2-2' }}</span></p>
      <p class="total">Total <span>{{ calculateSummary().total | currency:'PLN ':'symbol':'1.2-2' }}</span></p>
    </div>

    <div class="actions">
      <button routerLink="/" class="continue">← Kontynuuj Zakupy</button>
      <button routerLink="/order-details" class="checkout">Dostawa i Płatność →</button>
    </div>
  </ng-container>
</div>
