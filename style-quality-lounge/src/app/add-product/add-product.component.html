
  <div class="container">
    <form class="product-form">
      <h2>Dodaj produkt</h2>

      <div class="cover-photo">
        <img src="cover.jpg" alt="Zdjęcie okładkowe">
      </div>

      <div class="additional-photos">
        <div class="photo"><img src="thumb.jpg" alt="Dodatkowe zdjęcie"></div>
        <div class="photo"><img src="thumb.jpg" alt="Dodatkowe zdjęcie"></div>
        <div class="photo"><img src="thumb.jpg" alt="Dodatkowe zdjęcie"></div>
        <div class="photo upload">+</div>
      </div>

      <div class="form-group">
        <label for="product-name">Nazwa produktu</label>
        <input type="text" id="product-name" placeholder="Wprowadź nazwę produktu">
      </div>

      <div class="form-group">
        <label for="product-price">Cena (PLN)</label>
        <input type="number" id="product-price" placeholder="0.00" step="0.01">
      </div>

      <div class="form-group">
        <label for="product-description">Opis produktu</label>
        <textarea id="product-description" placeholder="Wprowadź opis produktu"></textarea>
      </div>

      <div class="buttons">
        <button type="button" class="cancel">Anuluj</button>
        <button type="submit" class="submit">Dodaj</button>
      </div>
    </form>
  </div>
