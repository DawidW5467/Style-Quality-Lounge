        <h3>{{ product.name }}</h3>

  <div class="section-header">
    <h2>{{ categories[currentCategoryIndex] }}</h2>
    <div class="carousel-controls">
      <span class="arrow" (click)="previousCategory()">&#9664;</span>
      <span class="arrow" (click)="nextCategory()">&#9654;</span>
    </div>
  </div>

  <div *ngIf="categoryLoading">Ładowanie produktów...</div>
  <div *ngIf="categoryError" class="error">{{ categoryError }}</div>


  <div class="product-grid" *ngIf="!categoryLoading && !categoryError">
    <div class="card" *ngFor="let product of categoryProducts" [routerLink]="['/product', product.id_product]">
      <img src="https://storage.googleapis.com/pod_public/1300/157553.jpg" alt="true sigma">
      <div class="card-content">
        <h3>{{ product.name }}</h3>
        <div class="price">{{ product.price }} zł</div>
        <button>Dodaj do koszyka</button>
      </div>
    </div>
  </div>

  <div *ngIf="!categoryLoading && !categoryError && categoryProducts.length === 0" class="no-products">
    Brak produktów w tej kategorii
  </div>


</div>
