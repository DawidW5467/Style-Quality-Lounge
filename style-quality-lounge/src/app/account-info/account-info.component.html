<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Profil użytkownika</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Profil -->
    <div class="card">
      <div class="profile-header">
        <img src="https://i.imgur.com/Q9qFt3m.png" alt="Avatar" class="avatar">
        <div>
          <p class="username">Cibab</p>
          <p class="role">Sigmiarz</p>
        </div>
      </div>
    </div>

    <!-- Statystyki -->
    <div class="stats">
      <div class="stat">
        <strong>45</strong>
        Wystawione
      </div>
      <div class="stat">
        <strong>128</strong>
        Sprzedane
      </div>
      <div class="stat">
        <strong>4.8</strong>
        Ocena
      </div>
    </div>

    <!-- Informacje osobiste -->
    <div class="card">
      <p class="section-title">Informacje osobiste</p>
      <div class="info-row">
        <div>
          <div class="info-label">Imię</div>
          <div class="info-value">Jan</div>
        </div>
      </div>
      <div class="info-row">
        <div>
          <div class="info-label">Nazwisko</div>
          <div class="info-value">Kowalski</div>
        </div>
      </div>
      <div class="info-row">
        <div>
          <div class="info-label">Email</div>
          <div class="info-value">jan.kowalski&#64;email.com</div>
        </div>
      </div>
    </div>

    <!-- Wystawione przedmioty -->
    <div class="card">
      <div class="items">
        <div class="item">
          <div class="item-name">iPhone 13 Pro</div>
          <div class="item-price">3999 zł</div>
        </div>
        <div class="item">
          <div class="item-name">Sony WH-1000XM4</div>
          <div class="item-price">1299 zł</div>
        </div>
        <div class="item">
          <div class="item-name">Apple Watch Series 7</div>
          <div class="item-price">2199 zł</div>
        </div>
      </div>
      <a href="#" class="button">📦 Zobacz wszystkie wystawione przedmioty</a>
    </div>
  </div>
</body>
</html>
