<div class="payment-card">
  <h2>Płatność</h2>
  <div class="method" [class.selected]="selectedMethod === 'card'" (click)="selectPaymentMethod('card')">
    <i>💳</i> Karta Płatnicza
  </div>
  <div class="method" [class.selected]="selectedMethod === 'transfer'" (click)="selectPaymentMethod('transfer')">
    <i>🏦</i> Przelew Pay'u
  </div>
  <div class="method" [class.selected]="selectedMethod === 'paysafe'" (click)="selectPaymentMethod('paysafe')">
    <i>🔒</i> Pay Safe Card
  </div>
  <button class="pay-button" [disabled]="!selectedMethod" (click)="goToHomePage()">Zapłać</button>
</div>
